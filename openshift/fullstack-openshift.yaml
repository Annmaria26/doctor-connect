# ==============================================================================
# DOCTOR CONNECT - OPENSHIFT FULL-STACK MANIFEST (PHP + MYSQL)
# Deploy: oc apply -f openshift/fullstack-openshift.yaml
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: doctor-connect-secrets
type: Opaque
stringData:
  database-root-password: "DoctorConnectRootSecret99!"
  database-name: "doctor_connect"
  database-user: "doctor_user"
  database-password: "DoctorUserSecret99!"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: image-registry.openshift-image-registry.svc:5000/openshift/mysql:8.0 # fallback: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: doctor-connect-secrets
                  key: database-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: doctor-connect-secrets
                  key: database-name
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: doctor-connect-secrets
                  key: database-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: doctor-connect-secrets
                  key: database-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-connect-app
  labels:
    app: doctor-connect-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-connect-app
  template:
    metadata:
      labels:
        app: doctor-connect-app
    spec:
      containers:
        - name: php-app
          image: doctor-connect-app:latest # Build via `oc new-build` or Binary Build
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_DRIVER
              value: "mysql"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: doctor-connect-secrets
                  key: database-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: doctor-connect-secrets
                  key: database-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: doctor-connect-secrets
                  key: database-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /index.php
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /index.php
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-connect-app
  labels:
    app: doctor-connect-app
spec:
  ports:
    - name: 8080-tcp
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: doctor-connect-app
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: doctor-connect-app
  labels:
    app: doctor-connect-app
spec:
  to:
    kind: Service
    name: doctor-connect-app
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
