# ==============================================================================
# DOCTOR CONNECT - OPENSHIFT FRONTEND MANIFEST
# Deploy: oc apply -f openshift/frontend-openshift.yaml
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-connect-frontend
  labels:
    app: doctor-connect-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-connect-frontend
  template:
    metadata:
      labels:
        app: doctor-connect-frontend
    spec:
      containers:
        - name: web
          image: quay.io/redhat-services-prod/doctor-connect-frontend:latest # Or your local imagestream/registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-connect-frontend
  labels:
    app: doctor-connect-frontend
spec:
  ports:
    - name: 8080-tcp
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: doctor-connect-frontend
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: doctor-connect-frontend
  labels:
    app: doctor-connect-frontend
spec:
  to:
    kind: Service
    name: doctor-connect-frontend
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
