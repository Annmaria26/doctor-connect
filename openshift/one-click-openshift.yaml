                    <input type="text" id="admin_walkin_reason" class="form-control">
                </div>
                <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeAdminWalkinModal()">Cancel</button>
                    <button type="submit" class="btn btn-teal">Issue Token &rarr;</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- ADD DOCTOR MODAL -->
    <div id="admin-doctor-modal" class="modal-overlay">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
                <h3 style="margin:0; font-size:1.2rem; font-weight:800;">Register New Doctor</h3>
                <button type="button" onclick="closeAddDoctorModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
    
            <form onsubmit="handleAddDoctor(event)">
                <div class="form-group">
                    <label class="form-label">Doctor Name *</label>
                    <input type="text" id="new_doc_name" class="form-control" required placeholder="e.g. Dr. Jane Carter">
                </div>
                <div class="form-group">
                    <label class="form-label">Specialization *</label>
                    <input type="text" id="new_doc_spec" class="form-control" required placeholder="e.g. ENT, Neurology...">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Fee ($)</label>
                        <input type="number" id="new_doc_fee" class="form-control" value="50" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Avg Duration (Mins)</label>
                        <input type="number" id="new_doc_mins" class="form-control" value="15" required>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeAddDoctorModal()">Cancel</button>
                    <button type="submit" class="btn btn-teal">Add Doctor</button>
                </div>
            </form>
        </div>
    </div>
    
    <footer class="footer">
        <div style="max-width:1240px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
            <div><strong>DoctorConnect</strong> &copy; 2026 &mdash; Token-Based Telehealth Platform (Frontend Standalone)</div>
            <div><span class="pulse-dot"></span> State Engine Active (Local Storage Sync)</div>
        </div>
    </footer>
    
    <script src="js/app.js"></script>
    <script>
    let selectedReceptionDocId = 1;
    
    function switchAdminTab(tabName) {
        document.querySelectorAll('.admin-pane').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.nav-tab-btn').forEach(el => el.classList.remove('active'));
    
        document.getElementById(`admin-tab-${tabName}`).style.display = 'block';
        const btn = Array.from(document.querySelectorAll('.nav-tab-btn')).find(el => el.textContent.toLowerCase().includes(tabName));
        if (btn) btn.classList.add('active');
    
        renderAdmin();
    }
    
    function renderAdmin() {
        const state = DCStore.load();
        const today = new Date().toISOString().split('T')[0];
    
        // 1. Reception Tabs
        const tabsContainer = document.getElementById('reception-doc-tabs');
        if (tabsContainer) {
            tabsContainer.innerHTML = state.doctors.map(d => `
                <button class="btn btn-sm ${d.id === selectedReceptionDocId ? 'btn-primary' : 'btn-outline'}" onclick="selectedReceptionDocId=${d.id}; renderAdmin();" style="white-space:nowrap;">
                    ${d.name} (${d.specialization})
                </button>
            `).join('');
        }
    
        const q = QueueEngine.getDoctorQueue(selectedReceptionDocId, today);
        const activeDoc = state.doctors.find(d => d.id === selectedReceptionDocId) || state.doctors[0];
        document.getElementById('reception-active-doc-label').textContent = `Managing Queue for ${activeDoc.name} (${activeDoc.specialization})`;
    
        document.getElementById('admin-kpi-serving').textContent = q.current_serving_token ? '#' + q.current_serving_token : 'None';
        document.getElementById('admin-kpi-next').textContent = q.next_waiting_token ? '#' + q.next_waiting_token : 'None';
        document.getElementById('admin-kpi-waiting').textContent = q.waiting_count;
        document.getElementById('admin-kpi-completed').textContent = q.completed_count;
    
        // Table
        const tbody = document.getElementById('reception-table-body');
        if (tbody) {
            tbody.innerHTML = q.tokens.map(t => `
                <tr style="${t.status === 'serving' ? 'background:#ecfdf5;' : ''}">
                    <td><strong style="color:#0284c7; font-size:1.1rem;">#${t.token_number}</strong></td>
                    <td><strong>${t.patient_name}</strong><br><span style="font-size:0.8rem; color:#64748b;">${t.reason || ''}</span></td>
                    <td>${t.patient_phone}</td>
                    <td>${t.estimated_time.split(' ')[1]}</td>
                    <td><span class="badge badge-${t.status}">${t.status.toUpperCase()} ${t.status === 'serving' ? '<span class="pulse-dot"></span>' : ''}</span></td>
                    <td>
                        ${t.status === 'waiting' ? `
                            <button class="btn btn-sm btn-primary" onclick="setAdminTokenStatus(${t.id}, 'serving')">Call</button>
                            <button class="btn btn-sm btn-outline" onclick="setAdminTokenStatus(${t.id}, 'no_show')">No-Show</button>
                        ` : (t.status === 'serving' ? `
                            <button class="btn btn-sm btn-outline" onclick="setAdminTokenStatus(${t.id}, 'completed')">Mark Served</button>
                        ` : '-')}
                    </td>
                </tr>
            `).join('');
        }
    
        // 2. TV Monitor
        const tvContainer = document.getElementById('tv-grid-container');
        if (tvContainer) {
            tvContainer.innerHTML = state.doctors.map(d => {
                const dq = QueueEngine.getDoctorQueue(d.id, today);
                return `
                    <div class="tv-card">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <span class="badge" style="background:#0284c7; color:white;">${d.specialization}</span>
                                <h3 style="font-size:1.35rem; margin-top:4px;">${d.name}</h3>
                            </div>
                            ${dq.current_serving_token ? '<span class="badge badge-serving"><span class="pulse-dot"></span> SERVING</span>' : ''}
                        </div>
    
                        <div style="background:linear-gradient(135deg, #0284c7, #0d9488); border-radius:12px; padding:1.25rem; text-align:center; margin:1.25rem 0;">
                            <div style="font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:#e0f2fe;">NOW SERVING</div>
                            <div style="font-size:3.5rem; font-weight:900; line-height:1.1;">
                                ${dq.current_serving_token ? '#' + dq.current_serving_token : '---'}
                            </div>
                            <div style="font-size:0.9rem; color:#f0fdf4; margin-top:2px;">
                                ${dq.current_serving ? dq.current_serving.patient_name : 'Waiting for next patient'}
                            </div>
                        </div>
    
                        <div style="display:flex; justify-content:space-between; background:#0f172a; padding:0.75rem 1rem; border-radius:8px; font-size:0.9rem;">
                            <div><span style="color:#94a3b8; font-size:0.75rem; display:block;">NEXT IN LINE</span><strong style="color:#f59e0b; font-size:1.1rem;">${dq.next_waiting_token ? '#' + dq.next_waiting_token : 'None'}</strong></div>
                            <div style="text-align:right;"><span style="color:#94a3b8; font-size:0.75rem; display:block;">WAITING</span><strong style="color:#38bdf8; font-size:1.1rem;">${dq.waiting_count} patients</strong></div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    
        // 3. Reports
        const totalAppts = state.appointments.length;
        const completedAppts = state.appointments.filter(a => a.status === 'completed').length;
        const noShowAppts = state.appointments.filter(a => a.status === 'no_show').length;
        let rev = 0;
        state.appointments.filter(a => a.status === 'completed').forEach(a => {
            const doc = state.doctors.find(d => d.id === a.doctor_id);
            if (doc) rev += doc.fee;
        });
    
        document.getElementById('rep-kpi-total').textContent = totalAppts;
        document.getElementById('rep-kpi-completed').textContent = `${completedAppts} (${totalAppts ? Math.round((completedAppts/totalAppts)*100) : 0}%)`;
        document.getElementById('rep-kpi-noshow').textContent = `${noShowAppts} (${totalAppts ? Math.round((noShowAppts/totalAppts)*100) : 0}%)`;
        document.getElementById('rep-kpi-revenue').textContent = `$${rev.toFixed(2)}`;
    
        const repTbody = document.getElementById('reports-table-body');
        if (repTbody) {
            repTbody.innerHTML = state.appointments.map(a => `
                <tr>
                    <td>${a.date}</td>
                    <td><strong style="color:#0284c7;">#${a.token_number}</strong></td>
                    <td>${a.patient_name}</td>
                    <td>Doctor #${a.doctor_id}</td>
                    <td><span class="badge badge-${a.status}">${a.status.toUpperCase()}</span></td>
                    <td>${a.diagnosis || '-'}</td>
                </tr>
            `).join('');
        }
    
        // 4. Doctor Roster
        const docTbody = document.getElementById('doctors-roster-body');
        if (docTbody) {
            docTbody.innerHTML = state.doctors.map(d => `
                <tr>
                    <td>#${d.id}</td>
                    <td><strong>${d.name}</strong></td>
                    <td><span class="badge" style="background:#e0f2fe; color:#0284c7;">${d.specialization}</span></td>
                    <td>$${d.fee.toFixed(2)}</td>
                    <td>${d.avg_mins} mins</td>
                    <td>${d.start_time} - ${d.end_time}</td>
                </tr>
            `).join('');
        }
    
        // 5. Settings
        document.getElementById('set_name').value = state.clinic_settings.clinic_name;
        document.getElementById('set_tagline').value = state.clinic_settings.clinic_tagline;
        document.getElementById('set_phone').value = state.clinic_settings.clinic_phone;
        document.getElementById('set_email').value = state.clinic_settings.clinic_email;
        document.getElementById('set_address').value = state.clinic_settings.clinic_address;
    }
    
    function triggerAdminCallNext() {
        const res = QueueEngine.callNext(selectedReceptionDocId);
        alert(res.message);
        renderAdmin();
    }
    
    function setAdminTokenStatus(id, status) {
        QueueEngine.setStatus(id, status);
        renderAdmin();
    }
    
    function openAdminWalkinModal() { document.getElementById('admin-walkin-modal').style.display = 'flex'; }
    function closeAdminWalkinModal() { document.getElementById('admin-walkin-modal').style.display = 'none'; }
    
    function handleAdminWalkin(e) {
        e.preventDefault();
        const name = document.getElementById('admin_walkin_name').value.trim();
        const phone = document.getElementById('admin_walkin_phone').value.trim();
        const reason = document.getElementById('admin_walkin_reason').value.trim();
        const today = new Date().toISOString().split('T')[0];
    
        const res = QueueEngine.bookToken(name, phone, selectedReceptionDocId, today, reason);
        if (res.success) {
            alert(`✓ Walk-in Token #${res.appointment.token_number} issued successfully for ${name}.`);
            closeAdminWalkinModal();
            renderAdmin();
        }
    }
    
    function openAddDoctorModal() { document.getElementById('admin-doctor-modal').style.display = 'flex'; }
    function closeAddDoctorModal() { document.getElementById('admin-doctor-modal').style.display = 'none'; }
    
    function handleAddDoctor(e) {
        e.preventDefault();
        const state = DCStore.load();
        const newDoc = {
            id: state.doctors.length + 1,
            name: document.getElementById('new_doc_name').value.trim(),
            specialization: document.getElementById('new_doc_spec').value.trim(),
            fee: parseFloat(document.getElementById('new_doc_fee').value) || 50,
            avg_mins: parseInt(document.getElementById('new_doc_mins').value, 10) || 15,
            start_time: '09:00',
            end_time: '17:00',
            bio: 'Board-certified medical specialist.'
        };
        state.doctors.push(newDoc);
        DCStore.save(state);
        alert(`Doctor ${newDoc.name} registered.`);
        closeAddDoctorModal();
        renderAdmin();
    }
    
    function handleSaveSettings(e) {
        e.preventDefault();
        const state = DCStore.load();
        state.clinic_settings.clinic_name = document.getElementById('set_name').value.trim();
        state.clinic_settings.clinic_tagline = document.getElementById('set_tagline').value.trim();
        state.clinic_settings.clinic_phone = document.getElementById('set_phone').value.trim();
        state.clinic_settings.clinic_email = document.getElementById('set_email').value.trim();
        state.clinic_settings.clinic_address = document.getElementById('set_address').value.trim();
        DCStore.save(state);
        alert('Clinic settings updated.');
        renderAdmin();
    }
    
    // Clock
    setInterval(() => {
        const el = document.getElementById('tv-clock');
        if (el) el.textContent = new Date().toLocaleTimeString();
    }, 1000);
    
    // Auto-sync
    window.addEventListener('storage', renderAdmin);
    window.addEventListener('dc_state_updated', renderAdmin);
    setInterval(renderAdmin, 2000);
    
    document.addEventListener('DOMContentLoaded', renderAdmin);
    </script>
    
    </body>
    </html>
    
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dc-assets
  labels:
    app: doctor-connect
data:
  style.css: |-
    /* ==============================================================================
       DOCTOR CONNECT - FRONTEND STANDALONE STYLESHEET
       Clean, modern, responsive medical-grade UI styling
       ============================================================================== */
    
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --teal: #0d9488;
      --teal-hover: #0f766e;
      --teal-light: #ccfbf1;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      
      --success: #10b981;
      --success-bg: #d1fae5;
      --warning: #f59e0b;
      --warning-bg: #fef3c7;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --info: #3b82f6;
      --info-bg: #dbeafe;
    
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: var(--font-sans);
      background-color: var(--slate-50);
      color: var(--slate-800);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    a:hover {
      color: var(--primary-hover);
    }
    
    /* TOP STATUS BANNER */
    .demo-top-bar {
      background: #0f172a;
      color: #e2e8f0;
      padding: 0.45rem 1.25rem;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .demo-top-bar a {
      color: #38bdf8;
      font-weight: 600;
    }
    .role-pills {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .role-pill {
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .role-pill:hover, .role-pill.active {
      background: #ffffff;
      color: #0f172a;
    }
    
    /* NAVBAR */
    .navbar {
      background: #ffffff;
      border-bottom: 1px solid var(--slate-200);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--slate-900);
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--teal));
      color: white;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }
    .brand span {
      color: var(--primary);
    }
    
    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.925rem;
      font-weight: 500;
      color: var(--slate-600);
      padding: 0.4rem 0.6rem;
      border-radius: var(--radius-sm);
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--primary);
      background: var(--primary-light);
    }
    
    /* MAIN CONTENT */
    .main-content {
      flex: 1;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
      padding: 1.75rem 1.25rem;
    }
    
    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-family: inherit;
      font-size: 0.925rem;
      font-weight: 600;
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-primary:hover { background: var(--primary-hover); color: #ffffff; }
    .btn-teal { background: var(--teal); color: #ffffff; }
    .btn-teal:hover { background: var(--teal-hover); color: #ffffff; }
    .btn-outline { background: #ffffff; border-color: var(--slate-300); color: var(--slate-700); }
    .btn-outline:hover { background: var(--slate-100); border-color: var(--slate-400); }
    .btn-danger { background: var(--danger); color: #ffffff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { font-size: 0.8rem; padding: 0.35rem 0.7rem; }
    .btn-lg { font-size: 1.05rem; padding: 0.75rem 1.5rem; }
    .btn:disabled, .btn.disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }
    
    /* CARDS */
    .card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--slate-100);
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--slate-900);
    }
    
    /* STATS KPI GRID */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }
    .stat-primary .stat-icon { background: var(--primary-light); color: var(--primary); }
    .stat-success .stat-icon { background: var(--success-bg); color: var(--success); }
    .stat-warning .stat-icon { background: var(--warning-bg); color: var(--warning); }
    .stat-danger .stat-icon { background: var(--danger-bg); color: var(--danger); }
    .stat-val { font-size: 1.6rem; font-weight: 700; color: var(--slate-900); line-height: 1.2; }
    .stat-label { font-size: 0.825rem; color: var(--slate-600); font-weight: 500; }
    
    /* BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
    }
    .badge-waiting { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .badge-serving { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .badge-completed { background: #e2e8f0; color: #334155; border: 1px solid #cbd5e1; }
    .badge-no_show { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .badge-cancelled { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
    
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    
    /* TABLES */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }
    .table th {
      background: var(--slate-100);
      color: var(--slate-700);
      font-weight: 600;
      padding: 0.75rem 1rem;
      border-bottom: 2px solid var(--slate-200);
    }
    .table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--slate-200);
      vertical-align: middle;
    }
    .table tr:hover td { background: var(--slate-50); }
    
    /* QUEUE DISPLAY */
    .queue-hero-card {
      background: linear-gradient(135deg, #0369a1, #0f766e);
      color: white;
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
    }
    .token-circle-badge {
      width: 130px;
      height: 130px;
      background: white;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 1rem 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .token-circle-badge .token-num { font-size: 3rem; font-weight: 800; line-height: 1; }
    .token-circle-badge .token-lbl { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--slate-600); }
    
    /* MEETING CONTAINER */
    .meeting-banner {
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin: 1.5rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.3s;
    }
    .meeting-locked { background: #f8fafc; border: 2px dashed var(--slate-300); color: var(--slate-600); }
    .meeting-unlocked { background: #ecfdf5; border: 2px solid var(--success); color: #065f46; }
    
    .video-frame-container {
      width: 100%;
      height: 550px;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--slate-300);
      background: #000;
    }
    .video-frame-container iframe { width: 100%; height: 100%; border: none; }
    
    /* FORMS */
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.875rem; font-weight: 600; color: var(--slate-700); margin-bottom: 0.4rem; }
    .form-control, .form-select {
      width: 100%;
      padding: 0.6rem 0.85rem;
      font-family: inherit;
      font-size: 0.925rem;
      border: 1px solid var(--slate-300);
      border-radius: var(--radius-sm);
      background-color: #ffffff;
      color: var(--slate-800);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .form-text { font-size: 0.8rem; color: var(--slate-400); margin-top: 0.3rem; }
    
    /* GRIDS */
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    
    /* PRESCRIPTION STYLES */
    .prescription-sheet {
      background: #ffffff;
      border: 1px solid var(--slate-300);
      border-radius: var(--radius-md);
      padding: 2.5rem;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: var(--shadow-md);
    }
    .rx-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--primary);
      margin-bottom: 1.5rem;
    }
    .rx-symbol {
      font-size: 2.5rem;
      font-weight: 800;
      font-family: serif;
      color: var(--primary);
      line-height: 1;
    }
    
    /* FOOTER */
    .footer {
      background: #ffffff;
      border-top: 1px solid var(--slate-200);
      padding: 1.5rem 1.25rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--slate-400);
      margin-top: auto;
    }
    
    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(2px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-box {
      background: white;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      padding: 1.75rem;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
    }
    
    /* PRINT MEDIA */
    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      .demo-top-bar, .navbar, .footer, .btn, .no-print, .alert { display: none !important; }
      .main-content { padding: 0 !important; max-width: 100% !important; }
      .prescription-sheet { border: none !important; box-shadow: none !important; padding: 0 !important; max-width: 100% !important; }
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      .nav-container { flex-direction: column; gap: 0.75rem; }
      .nav-links { flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .video-frame-container { height: 380px; }
      .stats-grid { grid-template-columns: 1fr; }
    }
    
  app.js: |-
    /**
     * ==============================================================================
     * DOCTOR CONNECT - FRONTEND REACTIVE STATE ENGINE (STANDALONE / NO BACKEND)
     * Uses browser localStorage with multi-tab real-time sync & Web Audio chime
     * ==============================================================================
     */
    
    const STORAGE_KEY = 'doctor_connect_frontend_state';
    
    // Pre-seeded initial application state
    function getInitialState() {
        const today = new Date().toISOString().split('T')[0];
        return {
            clinic_settings: {
                clinic_name: 'DoctorConnect TeleHealth Clinic',
                clinic_tagline: 'Instant Online Token & Live Queue Consultation',
                clinic_phone: '+1 (800) 555-0199',
                clinic_email: 'care@doctorconnect.com',
                clinic_address: '450 Healthtech Blvd, Suite 300, Silicon Valley, CA',
                default_slot_duration: 15,
                default_consultation_fee: 50.00
            },
            doctors: [
                { id: 1, name: 'Dr. Sarah Jenkins', specialization: 'Cardiology', fee: 80.00, avg_mins: 15, bio: 'Senior Cardiologist specializing in preventive heart health and hypertension management.', start_time: '09:00', end_time: '17:00' },
                { id: 2, name: 'Dr. Marcus Chen', specialization: 'Pediatrics', fee: 55.00, avg_mins: 15, bio: 'Compassionate pediatrician focusing on developmental milestones and acute care.', start_time: '08:30', end_time: '15:30' },
                { id: 3, name: 'Dr. Emily Rodriguez', specialization: 'Dermatology', fee: 65.00, avg_mins: 20, bio: 'Consultant dermatologist treating skin conditions, eczema, and tele-dermatology diagnostics.', start_time: '13:00', end_time: '18:00' },
                { id: 4, name: 'Dr. David Patel', specialization: 'General Medicine', fee: 40.00, avg_mins: 10, bio: 'Primary care physician managing viral illness, diabetes, and lifestyle wellness.', start_time: '08:00', end_time: '16:00' }
            ],
            current_user: {
                role: 'patient', // 'patient', 'doctor', 'admin'
                id: 1,
                name: 'John Doe',
                email: 'john.doe@gmail.com',
                phone: '+1 555-0101',
                active_doctor_id: 1
            },
            appointments: [
                {
                    id: 101,
                    patient_name: 'John Doe',
                    patient_phone: '+1 555-0101',
                    patient_email: 'john.doe@gmail.com',
                    doctor_id: 1,
                    date: today,
                    token_number: 1,
                    status: 'completed',
                    estimated_time: today + ' 09:00',
                    reason: 'Hypertension routine follow-up',
                    diagnosis: 'Controlled Essential Hypertension',
                    prescription: '1. Amlodipine 5mg - 1 tablet once daily in morning\n2. Low sodium diet (<2g/day)\n3. Recheck BP in 3 weeks',
                    meeting_link: 'https://meet.jit.si/doctor-connect-appt-101-demo'
                },
                {
                    id: 102,
                    patient_name: 'Jane Smith',
                    patient_phone: '+1 555-0102',
                    patient_email: 'jane.smith@gmail.com',
                    doctor_id: 1,
                    date: today,
                    token_number: 2,
                    status: 'serving',
                    estimated_time: today + ' 09:15',
                    reason: 'Chest tightness after brisk walking',
                    diagnosis: '',
                    prescription: '',
                    meeting_link: 'https://meet.jit.si/doctor-connect-appt-102-demo'
                },
                {
                    id: 103,
                    patient_name: 'Robert Brown',
                    patient_phone: '+1 555-0103',
                    patient_email: 'robert.brown@gmail.com',
                    doctor_id: 1,
                    date: today,
                    token_number: 3,
                    status: 'waiting',
                    estimated_time: today + ' 09:30',
                    reason: 'High cholesterol report review and fatigue',
                    diagnosis: '',
                    prescription: '',
                    meeting_link: 'https://meet.jit.si/doctor-connect-appt-103-demo'
                },
                {
                    id: 104,
                    patient_name: 'Alice Taylor',
                    patient_phone: '+1 555-0104',
                    patient_email: 'alice.taylor@gmail.com',
                    doctor_id: 1,
                    date: today,
                    token_number: 4,
                    status: 'waiting',
                    estimated_time: today + ' 09:45',
                    reason: 'Follow-up for ECG baseline review',
                    diagnosis: '',
                    prescription: '',
                    meeting_link: 'https://meet.jit.si/doctor-connect-appt-104-demo'
                }
            ],
            queue_logs: [
                { id: 1, appointment_id: 101, action: 'called', time: '09:00 AM' },
                { id: 2, appointment_id: 101, action: 'served', time: '09:14 AM' },
                { id: 3, appointment_id: 102, action: 'called', time: '09:15 AM' },
                { id: 4, appointment_id: 102, action: 'serving', time: '09:16 AM' }
            ]
        };
    }
    
    // Global Store Helper
    class DCStore {
        static load() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
                const initial = getInitialState();
                DCStore.save(initial);
                return initial;
            }
            try {
                return JSON.parse(raw);
            } catch (e) {
                const initial = getInitialState();
                DCStore.save(initial);
                return initial;
            }
        }
    
        static save(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            // Trigger manual event for same-tab updates
            window.dispatchEvent(new Event('dc_state_updated'));
        }
    
        static reset() {
            localStorage.removeItem(STORAGE_KEY);
            return DCStore.load();
        }
    }
    
    // Sound Synthesizer via HTML5 Web Audio API
    class AudioBell {
        static playChime() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioBell.ctx) AudioBell.ctx = new AudioContext();
                if (AudioBell.ctx.state === 'suspended') AudioBell.ctx.resume();
    
                const now = AudioBell.ctx.currentTime;
                
                // Bell tone 1 (523.25 Hz - C5)
                const osc1 = AudioBell.ctx.createOscillator();
                const gain1 = AudioBell.ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now);
                gain1.gain.setValueAtTime(0.18, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc1.connect(gain1);
                gain1.connect(AudioBell.ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.45);
    
                // Bell tone 2 (659.25 Hz - E5)
                const osc2 = AudioBell.ctx.createOscillator();
                const gain2 = AudioBell.ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, now + 0.15);
                gain2.gain.setValueAtTime(0.22, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                osc2.connect(gain2);
                gain2.connect(AudioBell.ctx.destination);
                osc2.start(now + 0.15);
                osc2.stop(now + 0.7);
            } catch (e) {
                console.log('Audio chime error:', e);
            }
        }
    }
    
    // Queue Controller
    class QueueEngine {
        static getDoctorQueue(doctorId, date) {
            const state = DCStore.load();
            const appts = state.appointments.filter(a => a.doctor_id === doctorId && a.date === date);
            appts.sort((a, b) => a.token_number - b.token_number);
    
            const currentServing = appts.find(a => a.status === 'serving') || null;
            const waitingList = appts.filter(a => a.status === 'waiting');
            const nextWaiting = waitingList.length > 0 ? waitingList[0] : null;
    
            return {
                current_serving: currentServing,
                current_serving_token: currentServing ? currentServing.token_number : null,
                next_waiting: nextWaiting,
                next_waiting_token: nextWaiting ? nextWaiting.token_number : null,
                waiting_count: waitingList.length,
                serving_count: currentServing ? 1 : 0,
                completed_count: appts.filter(a => a.status === 'completed').length,
                no_show_count: appts.filter(a => a.status === 'no_show').length,
                tokens: appts
            };
        }
    
        // Call Next Token
        static callNext(doctorId) {
            const state = DCStore.load();
            const today = new Date().toISOString().split('T')[0];
    
            // 1. If currently serving someone, mark them completed
            const currentlyServing = state.appointments.find(a => a.doctor_id === doctorId && a.date === today && a.status === 'serving');
            if (currentlyServing) {
                currentlyServing.status = 'completed';
                state.queue_logs.unshift({
                    id: Date.now(),
                    appointment_id: currentlyServing.id,
                    action: 'served',
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
            }
    
            // 2. Find lowest waiting token
            const waitingAppts = state.appointments.filter(a => a.doctor_id === doctorId && a.date === today && a.status === 'waiting');
            waitingAppts.sort((a, b) => a.token_number - b.token_number);
    
            if (waitingAppts.length === 0) {
                DCStore.save(state);
                return { success: false, message: 'No more waiting patients in queue for today.' };
            }
    
            const nextAppt = waitingAppts[0];
            nextAppt.status = 'serving';
    
            state.queue_logs.unshift({
                id: Date.now() + 1,
                appointment_id: nextAppt.id,
                action: 'called',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
    
            DCStore.save(state);
            AudioBell.playChime();
    
            return {
                success: true,
                message: `Token #${nextAppt.token_number} (${nextAppt.patient_name}) is now called to the consultation room!`,
                token: nextAppt
            };
        }
    
        // Mark Specific Token Status
        static setStatus(appointmentId, status) {
            const state = DCStore.load();
            const appt = state.appointments.find(a => a.id === appointmentId);
            if (!appt) return { success: false, message: 'Appointment not found.' };
    
            appt.status = status;
            state.queue_logs.unshift({
                id: Date.now(),
                appointment_id: appt.id,
                action: status === 'serving' ? 'called' : (status === 'completed' ? 'served' : status),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
    
            DCStore.save(state);
            if (status === 'serving') AudioBell.playChime();
            return { success: true, message: `Status updated to ${status}.` };
        }
    
        // Complete Consultation with Prescription Notes
        static completeConsultation(appointmentId, diagnosis, prescription) {
            const state = DCStore.load();
            const appt = state.appointments.find(a => a.id === appointmentId);
            if (!appt) return { success: false, message: 'Appointment not found.' };
    
            appt.status = 'completed';
            appt.diagnosis = diagnosis;
            appt.prescription = prescription;
    
            state.queue_logs.unshift({
                id: Date.now(),
                appointment_id: appt.id,
                action: 'served',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
    
            DCStore.save(state);
            return { success: true, message: 'Consultation completed and prescription saved!' };
        }
    
        // Atomic / Race-safe Sequential Token Generator
        static bookToken(patientName, patientPhone, doctorId, date, reason) {
            const state = DCStore.load();
            const doctor = state.doctors.find(d => d.id === doctorId);
            if (!doctor) return { success: false, error: 'Doctor not found.' };
    
            // Find max token number for this doctor and date
            const existingTokens = state.appointments
                .filter(a => a.doctor_id === doctorId && a.date === date)
                .map(a => a.token_number);
    
            const nextTokenNumber = existingTokens.length > 0 ? Math.max(...existingTokens) + 1 : 1;
    
            // Calculate estimated meeting time: session_start + (token_number - 1) * avg_mins
            const startParts = (doctor.start_time || '09:00').split(':');
            const startHours = parseInt(startParts[0], 10);
            const startMins = parseInt(startParts[1], 10);
    
            const totalOffsetMins = (nextTokenNumber - 1) * (doctor.avg_mins || 15);
            const finalHours = Math.floor((startMins + totalOffsetMins) / 60) + startHours;
            const finalMins = (startMins + totalOffsetMins) % 60;
            const ampm = finalHours >= 12 ? 'PM' : 'AM';
            const displayHours = finalHours % 12 || 12;
            const estTimeFormatted = `${date} ${displayHours.toString().padStart(2, '0')}:${finalMins.toString().padStart(2, '0')} ${ampm}`;
    
            const newId = Date.now();
            const newAppt = {
                id: newId,
                patient_name: patientName,
                patient_phone: patientPhone || '+1 555-0000',
                patient_email: patientName.toLowerCase().replace(/\s+/g, '.') + '@example.com',
                doctor_id: doctorId,
                date: date,
                token_number: nextTokenNumber,
                status: 'waiting',
                estimated_time: estTimeFormatted,
                reason: reason || 'General medical consultation',
                diagnosis: '',
                prescription: '',
                meeting_link: `https://meet.jit.si/doctor-connect-appt-${newId}`
            };
    
            state.appointments.push(newAppt);
            state.queue_logs.unshift({
                id: Date.now() + 2,
                appointment_id: newId,
                action: 'called',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
    
            DCStore.save(state);
            return { success: true, appointment: newAppt };
        }
    }
    
    // Client-Side CSV Generator
    function exportCSV() {
        const state = DCStore.load();
        const rows = [
            ['Appointment ID', 'Date', 'Token Number', 'Status', 'Estimated Meeting Time', 'Patient Name', 'Patient Phone', 'Doctor ID', 'Chief Complaint', 'Diagnosis', 'Prescription']
        ];
    
        state.appointments.forEach(a => {
            rows.push([
                a.id,
                a.date,
                a.token_number,
                a.status.toUpperCase(),
                a.estimated_time,
                `"${a.patient_name}"`,
                a.patient_phone,
                a.doctor_id,
                `"${(a.reason || '').replace(/"/g, '""')}"`,
                `"${(a.diagnosis || '').replace(/"/g, '""')}"`,
                `"${(a.prescription || '').replace(/"/g, '""')}"`
            ]);
        });
    
        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + rows.map(e => e.join(',')).join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `doctor_connect_report_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-connect
  labels:
    app: doctor-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doctor-connect
  template:
    metadata:
      labels:
        app: doctor-connect
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: html-vol
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: html-vol
              mountPath: /usr/share/nginx/html/patient.html
              subPath: patient.html
            - name: html-vol
              mountPath: /usr/share/nginx/html/doctor.html
              subPath: doctor.html
            - name: html-vol
              mountPath: /usr/share/nginx/html/admin.html
              subPath: admin.html
            - name: assets-vol
              mountPath: /usr/share/nginx/html/css/style.css
              subPath: style.css
            - name: assets-vol
              mountPath: /usr/share/nginx/html/js/app.js
              subPath: app.js
      volumes:
        - name: html-vol
          configMap:
            name: dc-html
        - name: assets-vol
          configMap:
            name: dc-assets
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-connect
  labels:
    app: doctor-connect
spec:
  ports:
    - name: 8080-tcp
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: doctor-connect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: doctor-connect
  labels:
    app: doctor-connect
spec:
  to:
    kind: Service
    name: doctor-connect
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
